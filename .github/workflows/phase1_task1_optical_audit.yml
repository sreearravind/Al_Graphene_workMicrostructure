name: Phase 1 Task 1 Optical Source Audit

on:
  push:
    branches: [audit/phase1-task1-optical-validation]
    paths:
      - 'Phase1_Task1_Optical_Source_Audit/validate_optical_sources.py'
      - '.github/workflows/phase1_task1_optical_audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  source-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout all archived image files
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow
        run: python -m pip install 'Pillow>=10,<12'
      - name: Audit original BMP against previous TIFF files
        run: python Phase1_Task1_Optical_Source_Audit/validate_optical_sources.py
      - name: Commit provenance report and contact sheets to audit branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Phase1_Task1_Optical_Source_Audit/output
          if ! git diff --cached --quiet; then
            git commit -m 'Record source-image validation outputs'
            git push
          fi
