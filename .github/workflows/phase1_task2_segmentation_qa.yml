name: Phase 1 Task 2 Segmentation QA Screening

on:
  push:
    branches: [audit/phase1-task1-optical-validation]
    paths:
      - 'Phase1_Task2_Segmentation_QA/assess_existing_segmentation.py'
      - '.github/workflows/phase1_task2_segmentation_qa.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  segmentation-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install analysis packages
        run: python -m pip install "pandas>=2,<3" "Pillow>=10,<12" "numpy>=1.26,<3"
      - name: Screen existing segmentation measurements and generate optical contact sheets
        run: python Phase1_Task2_Segmentation_QA/assess_existing_segmentation.py
      - name: Commit QA outputs to audit branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Phase1_Task2_Segmentation_QA/output
          if ! git diff --cached --quiet; then
            git commit -m 'Record task 2 segmentation QA and review imagery'
            git push
          fi
