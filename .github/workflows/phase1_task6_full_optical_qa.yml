name: Phase 1 Task 6 Full Optical Image Quality Audit
on:
  push:
    branches: [audit/phase1-task1-optical-validation]
    paths:
      - 'Phase1_Task6_Image_Quality_36Fields/audit_all_36_fields.py'
      - '.github/workflows/phase1_task6_full_optical_qa.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  whole-matrix-image-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out all 36 original 100x microscopy fields
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install quality-analysis and original segmentation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas matplotlib pillow openpyxl tabulate scipy scikit-image seaborn imageio tifffile
          git clone https://github.com/pranavkokati/grainstat.git /tmp/grainstat_repo
          cd /tmp/grainstat_repo
          git checkout 6398251a2fe557ed4b8279e0e7a15a0f97ed62de
          sed -i 's/from skimage.feature import peak_local_maxima/from skimage.feature import peak_local_max as peak_local_maxima/' grainstat/core/segmentation.py
          sed -i '/from \.interactive import InteractivePlotter/d' grainstat/visualization/__init__.py
          sed -i "s/__all__ = \['PlotGenerator', 'InteractivePlotter'\]/__all__ = ['PlotGenerator']/" grainstat/visualization/__init__.py
      - name: Audit all 12 conditions and 36 fields (144 independent runs)
        env:
          PYTHONPATH: /tmp/grainstat_repo
          MPLBACKEND: Agg
        run: |
          python Phase1_Task6_Image_Quality_36Fields/audit_all_36_fields.py
      - name: Commit only derived quality audit outputs to audit branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Phase1_Task6_Image_Quality_36Fields/output
          if ! git diff --cached --quiet; then
            git commit -m 'Record all 36 optical image QA results and processing robustness'
            git push
          fi
