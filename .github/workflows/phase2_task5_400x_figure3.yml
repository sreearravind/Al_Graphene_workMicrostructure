name: Phase 2 Task 5 - Original 400x Figure 3 Source Audit
on:
  push:
    branches: [audit/phase1-task1-optical-validation]
    paths:
      - 'Phase2_Task5_Microstructure_XRD_Evidence/audit_400x_figure3.py'
      - '.github/workflows/phase2_task5_400x_figure3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-400x-figure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out immutable original microscopy archives
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image processing reader
        run: python -m pip install "pillow>=10,<12"
      - name: Cross-validate all 36 original 400x BMPs and generate uncalibrated montage
        run: python Phase2_Task5_Microstructure_XRD_Evidence/audit_400x_figure3.py
      - name: Commit audit derivatives to isolated audit branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Phase2_Task5_Microstructure_XRD_Evidence/output
          if ! git diff --cached --quiet; then
            git commit -m 'Record original 400x microscopy provenance and non-scaled Figure 3 draft'
            git push
          fi
