name: Phase 2 Task 6 - Author-Confirmed 400x Calibration and Figure 3
on:
  push:
    branches: [audit/phase1-task1-optical-validation]
    paths:
      - 'Phase2_Task6_Calibration_and_Record_Closure/render_working_400x_figure3.py'
      - 'Phase2_Task6_Calibration_and_Record_Closure/400x_reference_calibration_audit.json'
      - '.github/workflows/phase2_task6_provisional_400x_calibration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  draft-calibrated-optical-figure:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out all 36 original optical micrographs
        uses: actions/checkout@v4
      - name: Use Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image reader
        run: python -m pip install "pillow>=10,<12"
      - name: Validate 36 pixel pairs and render 12-panel conditional-scale figure
        run: python Phase2_Task6_Calibration_and_Record_Closure/render_working_400x_figure3.py
      - name: Commit derived audit figure and manifest to audit branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Phase2_Task6_Calibration_and_Record_Closure/output
          if ! git diff --cached --quiet; then
            git commit -m 'Record researcher-confirmed 400x calibration and traced Figure 3 source'
            git pull --rebase origin audit/phase1-task1-optical-validation
            git push origin HEAD:audit/phase1-task1-optical-validation
          fi
