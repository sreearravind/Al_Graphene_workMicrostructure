name: Reanalyse grains for reviewer comments 3-4-5

on:
  push:
    branches: [ main ]
    paths:
      - 'Revision_Comments_3_4_5/reanalyse_grain_microstructure.py'
      - '.github/workflows/reanalyse_grains_comments_3_4_5.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  grain-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas matplotlib pillow openpyxl tabulate
          pip install 'git+https://github.com/pranavkokati/grainstat.git#subdirectory=grainstat'

      - name: Run multi-field grain analysis
        run: |
          python Revision_Comments_3_4_5/reanalyse_grain_microstructure.py

      - name: Commit generated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Revision_Comments_3_4_5/output
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Generate multi-field grain analysis outputs for comments 3-5"
            git push
          fi
