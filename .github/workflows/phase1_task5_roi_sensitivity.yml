name: Phase 1 Task 5 Transparent ROI Sensitivity

on:
  push:
    branches: [audit/phase1-task1-optical-validation]
    paths:
      - 'Phase1_Task5_Transparent_ROI_Sensitivity/analyse_duplicate_policies.py'
      - '.github/workflows/phase1_task5_roi_sensitivity.yml'
      - 'Phase1_Task4_Expert_ROI_Validation/manual_rois/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  transparent-roi-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout optical experimental sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Configure Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies and archived GrainStat implementation
        run: |
          python -m pip install --upgrade pip
          pip install pandas matplotlib pillow openpyxl tabulate scipy scikit-image seaborn imageio tifffile "roifile==2026.2.10"
          git clone https://github.com/pranavkokati/grainstat.git /tmp/grainstat_repo
          cd /tmp/grainstat_repo
          git checkout 6398251a2fe557ed4b8279e0e7a15a0f97ed62de
          sed -i 's/from skimage.feature import peak_local_maxima/from skimage.feature import peak_local_max as peak_local_maxima/' grainstat/core/segmentation.py
          sed -i '/from \.interactive import InteractivePlotter/d' grainstat/visualization/__init__.py
          sed -i "s/__all__ = \['PlotGenerator', 'InteractivePlotter'\]/__all__ = ['PlotGenerator']/" grainstat/visualization/__init__.py
      - name: Compute first-vs-last duplicate grouping sensitivity and preserve all ROIs
        env:
          PYTHONPATH: /tmp/grainstat_repo
          MPLBACKEND: Agg
        run: |
          python Phase1_Task5_Transparent_ROI_Sensitivity/analyse_duplicate_policies.py
      - name: Commit only reproducible derived audit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Phase1_Task5_Transparent_ROI_Sensitivity/output
          if ! git diff --cached --quiet; then
            git commit -m "Record unbiased exploratory human ROI duplicate sensitivity"
            git push
          fi
